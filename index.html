<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>窗帘孔距对照表 + 逆向计算器</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      max-width: 950px;
      margin: 30px auto;
      padding: 0 15px;
    }
    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 25px;
      font-size: 24px;
    }
    h2 {
      font-size: 18px;
      margin:20px 0 10px;
      color:#333;
      border-left:4px #2563eb solid;
      padding-left:8px;
    }
    .search-box, .calc-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    input {
      padding: 12px 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      min-width:140px;
      inputmode: decimal;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-blue {
      background: #2563eb;
      color: #fff;
    }
    .btn-blue:hover {
      background: #1d4ed8;
    }
    #tip {
      margin: 10px 0;
      font-size: 15px;
      min-height: 22px;
    }
    .success { color: #039442; }
    .error { color: #dc2626; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top:10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
      font-size: 15px;
    }
    th {
      background-color: #eff6ff;
    }
    .result-calc{
      margin-top:8px;
      padding:10px;
      background:#f0f7ff;
      border-radius:6px;
    }
  </style>
</head>
<body>
  <h1>窗帘孔距对照表 + 逆向计算器</h1>

  <h2>一、宽度查表（读取标准数据表）</h2>
  <div class="search-box">
    <input id="widthInput" placeholder="输入窗帘宽度(cm)">
    <button id="searchBtn" class="btn-blue">查表查询</button>
  </div>
  <div id="tip" class="error">正在加载数据库 打孔孔距.xlsx...</div>
  <table id="resultTable">
    <thead>
      <tr>
        <th>宽度(cm)</th>
        <th>孔数</th>
        <th>孔距(cm)</th>
        <th>单边边距(cm)</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <h2>二、计算1：宽度+孔数 → 计算孔距（单边7cm）</h2>
  <div class="calc-box">
    <input id="calcW1" placeholder="总宽度cm">
    <input id="calcN1" placeholder="打孔数量">
    <button id="calcBtn1" class="btn-blue">开始计算</button>
  </div>
  <div class="result-calc" id="calcRes1"></div>

  <h2>三、计算2：宽度+孔距 → 反推所需孔数（单边7cm）</h2>
  <div class="calc-box">
    <input id="calcW2" placeholder="总宽度cm">
    <input id="calcD2" placeholder="孔距cm">
    <button id="calcBtn2" class="btn-blue">开始计算</button>
  </div>
  <div class="result-calc" id="calcRes2"></div>

  <h2>四、计算3：孔距+孔数 → 算出成品总宽度（单边7cm）</h2>
  <div class="calc-box">
    <input id="calcD3" placeholder="孔距cm">
    <input id="calcN3" placeholder="打孔数量">
    <button id="calcBtn3" class="btn-blue">开始计算</button>
  </div>
  <div class="result-calc" id="calcRes3"></div>

  <script>
    const excelUrl = "/jsq/打孔孔距.xlsx";
    let tableData = [];
    const tipDom = document.getElementById("tip");
    const tableBody = document.getElementById("tableBody");
    const widthInput = document.getElementById("widthInput");
    const searchBtn = document.getElementById("searchBtn");
    const STANDARD_SIDE = 7;

    // 四舍五入保留1位小数
    function formatOneDecimal(val) {
      const num = Number(val);
      const rounded = Math.round(num * 10) / 10;
      return rounded.toFixed(1);
    }

    // 加载Excel表格
    fetch(excelUrl)
      .then(resp => {
        if (!resp.ok) throw new Error(`Excel文件加载失败`);
        return resp.arrayBuffer();
      })
      .then(buffer => {
        const workbook = XLSX.read(buffer, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        tableData = XLSX.utils.sheet_to_json(sheet);
        tipDom.className = "success";
        tipDom.innerText = "✅ 数据加载完成，可查表或逆向计算";
      })
      .catch(err => {
        tipDom.className = "error";
        tipDom.innerText = "❌ " + err.message + "，下方计算器可正常使用";
        console.error(err);
      });

    // 查表功能
    searchBtn.addEventListener("click", doSearch);
    widthInput.addEventListener("keydown", e => e.key === "Enter" && doSearch());
    function doSearch() {
      const rawVal = widthInput.value.trim();
      tableBody.innerHTML = "";
      if(rawVal === ""){
        tipDom.className = "error";
        tipDom.innerText = "请输入宽度数字";
        return;
      }
      const targetWidth = parseFloat(rawVal);
      const matchList = tableData.filter(item => Number(item["宽度(cm)"]) === targetWidth);
      if (matchList.length === 0) {
        tipDom.className = "error";
        tipDom.innerText = `无${targetWidth}cm标准数据，使用下方计算器自定义计算`;
        return;
      }
      tipDom.className = "success";
      tipDom.innerText = `匹配${matchList.length}条标准数据`;
      matchList.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row["宽度(cm)"]}</td>
          <td>${row["孔数"]}</td>
          <td>${formatOneDecimal(row["孔距(cm)"])}</td>
          <td>${formatOneDecimal(row["单边边距(cm)"])}</td>
        `;
        tableBody.appendChild(tr);
      })
    }

    // 计算1：宽+孔数 = 孔距
    const calcW1 = document.getElementById("calcW1");
    const calcN1 = document.getElementById("calcN1");
    const calcBtn1 = document.getElementById("calcBtn1");
    const calcRes1 = document.getElementById("calcRes1");
    calcBtn1.addEventListener("click", () => {
      const strW = calcW1.value.trim();
      const strN = calcN1.value.trim();
      if(strW === "" || strN === ""){
        calcRes1.innerHTML = `<span class="error">错误：宽度、孔数不能为空</span>`;
        return;
      }
      const W = parseFloat(strW);
      const N = parseFloat(strN);
      if(W <= 0 || N <= 1){
        calcRes1.innerHTML = `<span class="error">错误：宽度大于0，孔数最少2个</span>`;
        return;
      }
      const dist = (W - 2 * STANDARD_SIDE) / (N - 1);
      calcRes1.innerHTML = `
        <strong>计算结果</strong><br>
        总宽度：${W}cm，打孔数量：${N}个<br>
        单边预留边距：${STANDARD_SIDE}.0cm<br>
        相邻孔距：${formatOneDecimal(dist)}cm
      `;
    })

    // 计算2：宽+孔距 = 孔数
    const calcW2 = document.getElementById("calcW2");
    const calcD2 = document.getElementById("calcD2");
    const calcBtn2 = document.getElementById("calcBtn2");
    const calcRes2 = document.getElementById("calcRes2");
    calcBtn2.addEventListener("click", () => {
      const strW = calcW2.value.trim();
      const strD = calcD2.value.trim();
      if(strW === "" || strD === "") {
        calcRes2.innerHTML = `<span class="error">错误：宽度、孔距不能为空</span>`;
        return;
      }
      const W = parseFloat(strW);
      const D = parseFloat(strD);
      if(W <= 0 || D <= 0) {
        calcRes2.innerHTML = `<span class="error">错误：宽度、孔距必须大于0</span>`;
        return;
      }
      let nRaw = (W - 2 * STANDARD_SIDE) / D + 1;
      const holeNum = Math.ceil(nRaw);
      const realDist = (W - 2 * STANDARD_SIDE) / (holeNum - 1);
      calcRes2.innerHTML = `
        <strong>计算结果</strong><br>
        总宽度：${W}cm，设定孔距：${D}cm<br>
        单边预留边距：${STANDARD_SIDE}.0cm<br>
        理论孔数：${formatOneDecimal(nRaw)}｜实际取整孔数：${holeNum}个<br>
        修正后实际孔距：${formatOneDecimal(realDist)}cm
      `;
    })

    // ========== 新增计算3：孔距 + 孔数 求总宽度 ==========
    const calcD3 = document.getElementById("calcD3");
    const calcN3 = document.getElementById("calcN3");
    const calcBtn3 = document.getElementById("calcBtn3");
    const calcRes3 = document.getElementById("calcRes3");
    calcBtn3.addEventListener("click", () => {
      const strD = calcD3.value.trim();
      const strN = calcN3.value.trim();
      if(strD === "" || strN === ""){
        calcRes3.innerHTML = `<span class="error">错误：孔距、孔数不能为空</span>`;
        return;
      }
      const D = parseFloat(strD);
      const N = parseFloat(strN);
      if(D <= 0 || N <= 1){
        calcRes3.innerHTML = `<span class="error">错误：孔距>0，孔数不能小于2</span>`;
        return;
      }
      const totalWidth = 2 * STANDARD_SIDE + D * (N - 1);
      calcRes3.innerHTML = `
        <strong>计算结果</strong><br>
        设定孔距：${D}cm，打孔数量：${N}个<br>
        两侧总边距：${STANDARD_SIDE * 2}.0cm<br>
        对应窗帘总宽度：${formatOneDecimal(totalWidth)}cm
      `;
    })
  </script>
</body>
</html>
