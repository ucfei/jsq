      padding: 0 15px;
    }

      text-align: center;
      color: #222;
      margin-bottom: 25px;
      font-size: 24px;
    }
    h2 {
      font-size: 18px;
      margin:20px 0 10px;
      color:#333;
      border-left:4px #2563eb solid;
      padding-left:8px;
    }
    .search-box, .calc-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    input {
      padding: 12px 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      min-width:140px;
      inputmode: decimal;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-blue {
      background: #2563eb;
      color: #fff;
    }
    .btn-blue:hover {
      background: #1d4ed8;
    }
    #tip {
      margin: 10px 0;
      font-size: 15px;
      min-height: 22px;
    }
    .success { color: #039442; }
    .error { color: #dc2626; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top:10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
      font-size: 15px;
    }
    th {
      background-color: #eff6ff;
    }
    .result-calc{

      padding:10px;
      background:#f0f7ff;
      border-radius:6px;
    }
  </style>
</head>

        <th>宽度(cm)</th>
        <th>孔数</th>

        <th>单边边距(cm)</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

    <button id="calcBtn1" class="btn-blue">开始计算</button>
  </div>
  <div class="result-calc" id="calcRes1"></div>
